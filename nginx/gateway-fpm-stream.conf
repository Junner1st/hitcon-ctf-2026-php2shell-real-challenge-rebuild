worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

stream {
    upstream fpm_a_http {
        server nginx-fpm-a:80;
    }

    upstream fpm_b_http {
        server nginx-fpm-b:80;
    }

    server {
        listen 8081;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass fpm_a_http;
    }

    server {
        listen 8082;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass fpm_b_http;
    }
}
