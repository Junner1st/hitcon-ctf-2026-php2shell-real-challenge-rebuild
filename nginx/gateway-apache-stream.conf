worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

stream {
    upstream apache_target {
        server wp-apache:80;
    }

    server {
        listen 8083;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass apache_target;
    }
}
